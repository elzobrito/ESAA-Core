version: "0.4.1"

# Validada contra o schema distribuido com o pacote (esaa/templates/runtime_policy.schema.json).
# Chave desconhecida ou valor invalido falham com POLICY_INVALID. Blocos marcados como
# RESERVADO sao aceitos por compatibilidade, mas nenhum codigo os le nesta versao.

review_authorization: "qa_role"

# AUD-O0-020: com "enforce", o runner que fez claim/complete de uma tarefa nao
# pode revisa-la (SELF_REVIEW_FORBIDDEN). "off" (default) mantem o historico:
# o papel de QA e resolvido pelo nome do actor, sem exigir runner distinto.
review_runner_separation: "off"

# G08/PROV-02: permissive aceita qualquer runner_id; strict exige registro na secao runners do swarm
runner_validation: "permissive"

attempt_lifecycle:
  ttl: "PT30M"
  # RESERVADO: aceito pelo schema, sem efeito nesta versao do runtime.
  on_ttl_exceeded:
    emit_event: "output.rejected"
    error_code: "ATTEMPT_TIMEOUT"

attempt_limits:
  max_attempts_per_task: 3
  cooldown_between_attempts: "PT2M"
  # RESERVADO: aceito pelo schema, sem efeito nesta versao do runtime.
  on_limit_exceeded:
    emit_event: "issue.report"
    auto_severity: "high"

# RESERVADO: aceito pelo schema, sem efeito nesta versao do runtime.
issue_escalation:
  rules:
    - severity: "low"
      action: "log_only"
    - severity: "medium"
      action: "log_and_flag"
    - severity: "high"
      action: "block_task"
    - severity: "critical"
      action: "halt_pipeline"

# RESERVADO: aceito pelo schema, sem efeito nesta versao do runtime.
verify_policy:
  on_mismatch:
    action: "reproject_or_halt"
  on_corrupted:
    action: "halt_and_snapshot"
  snapshot_retention:
    max_snapshots: 20
    cleanup_policy: "oldest_first"
