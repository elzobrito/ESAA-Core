version: "0.4.1"

review_authorization: "qa_role"

# Administrative ceilings for per-task resource_limits. Absence keeps the
# historical defaults (32 / 2MiB / 8MiB) as both default and ceiling.
resource_limit_caps:
  max_file_updates: 64
  max_bytes_per_update: 4194304
  max_bytes_total: 8388608

# G08/PROV-02: permissive aceita qualquer runner_id; strict exige registro na secao runners do swarm
runner_validation: "permissive"

attempt_lifecycle:
  ttl: "PT30M"
  on_ttl_exceeded:
    emit_event: "output.rejected"
    error_code: "ATTEMPT_TIMEOUT"

attempt_limits:
  max_attempts_per_task: 3
  cooldown_between_attempts: "PT2M"
  on_limit_exceeded:
    emit_event: "issue.report"
    auto_severity: "high"

issue_escalation:
  rules:
    - severity: "low"
      action: "log_only"
    - severity: "medium"
      action: "log_and_flag"
    - severity: "high"
      action: "block_task"
    - severity: "critical"
      action: "halt_pipeline"

verify_policy:
  on_mismatch:
    action: "reproject_or_halt"
  on_corrupted:
    action: "halt_and_snapshot"
  snapshot_retention:
    max_snapshots: 20
    cleanup_policy: "oldest_first"
